<div class="projects-container">
  <h1>Vos projets</h1>

  <div class="add-project-section">
    <button class="add-project-btn" (click)="toggleAddProjectForm()">
      {{ showAddProjectForm ? 'Annuler' : 'Ajouter un projet' }}
    </button>
  </div>

  <div class="add-project-form" *ngIf="showAddProjectForm">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nom du projet</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="newProject.name"
          name="name"
          class="form-control"
          required
        />
      </div>
    
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          [(ngModel)]="newProject.description"
          name="description"
          class="form-control"
          required
        ></textarea>
      </div>
    
      <div class="form-group">
        <label for="startDate">Date de début</label>
        <input
          type="date"
          id="startDate"
          [(ngModel)]="newProject.startDate"
          name="startDate"
          class="form-control"
          required
        />
      </div>
    
      <div class="form-group">
        <label for="endDate">Date de fin</label>
        <input
          type="date"
          id="endDate"
          [(ngModel)]="newProject.endDate"
          name="endDate"
          class="form-control"
          required
        />
      </div>
    
      <div class="form-group">
        <label for="client">Chef de projet</label>
        <input
          type="text"
          id="client"
          [(ngModel)]="newProject.client"
          name="client"
          class="form-control"
          required
        />
      </div>
    
      <div class="form-group">
        <label for="status">Statut</label>
        <select
          id="status"
          [(ngModel)]="newProject.status"
          name="status"
          class="form-control"
          required
        >
          <option value="pending">En attente</option>
          <option value="in_progress">En cours</option>
          <option value="completed">Terminé</option>
        </select>
      </div>
    
      <button type="submit" class="btn btn-primary">Créer le projet</button>
    </form>
    
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <ul class="projects-list" *ngIf="projects.length > 0; else noProjects">
    <li class="project-item" *ngFor="let project of projects">
      <div class="project-info">
        <h3>{{ project.name }}</h3>
        <p>{{ project.description }}</p>
        <p><strong>Chef de projet:</strong> {{ project.client }}</p>
      </div>

      <div class="project-actions">
        <button class="view-project-btn" (click)="viewProjectDetails(project.id)">
          Voir les détails
        </button>

        <!-- Nouveau bouton pour voir les tâches -->
        <button class="view-tasks-btn" (click)="viewProjectTasks(project.id)">
          Voir les tâches du projet
        </button>
      </div>
    </li>
  </ul>

  <ng-template #noProjects>
    <p>Aucun projet trouvé. Cliquez sur "Ajouter un projet" pour en créer un nouveau.</p>
  </ng-template>
</div>

<div class="invite-member">
  <h3>Inviter un membre au projet</h3>
  <form (ngSubmit)="inviteMember()" #inviteForm="ngForm">
    <input
      type="email"
      [(ngModel)]="inviteEmail"
      name="email"
      required
      placeholder="Adresse email"
    />
    <select [(ngModel)]="inviteRole" name="role" required>
      <option value="ADMIN">Administrateur</option>
      <option value="MEMBRE">Membre</option>
      <option value="OBSERVATEUR">Observateur</option>
    </select>
    <button type="submit" [disabled]="!inviteForm.form.valid">Inviter</button>
  </form>
</div>
