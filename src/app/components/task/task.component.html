<!-- src/app/components/task/task.component.html -->

<h1>Page des Tâches</h1>

<!-- Affichage des détails d'une tâche spécifique si un ID est présent -->
<div *ngIf="taskId; else showTasks">
  <h2>Détails de la tâche avec ID: {{ taskId }}</h2>
  <!-- Ici tu peux afficher les détails réels de la tâche basée sur l'ID -->
  <p>Détails de la tâche à charger depuis un service ou API...</p>
</div>

<!-- Si aucun ID, on affiche la liste des tâches -->
<ng-template #showTasks>
  <h2>Liste des Tâches</h2>
  <ul>
    <li *ngFor="let task of tasks">{{ task }}</li>
  </ul>
</ng-template>
