<div class="task-container">
  <h1 class="page-title">Liste des Tâches</h1>

  <!-- Affichage des détails d'une tâche spécifique si un ID est présent -->
  <div *ngIf="taskId; else showTasks" class="task-detail">
    <h2>Détails de la tâche</h2>
    <p><strong>ID de la tâche :</strong> {{ taskId }}</p>
    <p class="task-description">
      Détails de la tâche à charger depuis un service ou API...
    </p>
  </div>

  <!-- Si aucun ID, on affiche la liste des tâches -->
  <ng-template #showTasks>
    <h2>Liste de toutes les Tâches</h2>
    <ul class="task-list">
      <li *ngFor="let task of tasks" class="task-item">
        {{ task }}
      </li>
    </ul>
  </ng-template>
</div>
