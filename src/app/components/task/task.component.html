<div class="task-list">
  <h2>Liste des Tâches</h2>

  <!-- Formulaire pour créer une nouvelle tâche -->
  <div class="create-task-form">
    <h3>Créer une nouvelle tâche</h3>
    <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
      <div class="form-group">
        <label for="title">Titre de la tâche</label>
        <input id="title" type="text" class="form-control" [(ngModel)]="task.title" name="title" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" class="form-control" [(ngModel)]="task.description" name="description" required></textarea>
      </div>

      <div class="form-group">
        <label for="dueDate">Date d'échéance</label>
        <input id="dueDate" type="date" class="form-control" [(ngModel)]="task.dueDate" name="dueDate" required />
      </div>

      <div class="form-group">
        <label for="status">Statut</label>
        <select id="status" class="form-control" [(ngModel)]="task.status" name="status" required>
          <option value="New">Nouveau</option>
          <option value="In Progress">En cours</option>
          <option value="Completed">Terminé</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Créer la tâche</button>
    </form>
  </div>

  <!-- Liste des tâches -->
  <div *ngFor="let task of tasks">
    <p>{{ task.title }}</p>
    <p>{{ task.description }}</p>
    <p>{{ task.dueDate | date }}</p>
    <p>{{ task.status }}</p>
  </div>
</div>
