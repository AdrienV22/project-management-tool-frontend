<header class="app-header">
  <div class="app-header-inner">
    <h1 class="app-title">Project Management Tool</h1>

    <nav class="app-nav" aria-label="Navigation principale">
      <div class="nav-links">
        <a routerLink="/login" *ngIf="!(isLoggedIn$ | async)">Connexion</a>
        <a routerLink="/register" *ngIf="!(isLoggedIn$ | async)">Inscription</a>
        <a routerLink="/projects" *ngIf="isLoggedIn$ | async">Projets</a>
      </div>

      <div class="nav-right">
        <button
          *ngIf="isLoggedIn$ | async"
          (click)="logout()"
          class="logout-btn"
          type="button"
        >
          Déconnexion
        </button>
      </div>
    </nav>
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>&copy; 2025 Project Management Tool Adrien</p>
</footer>
