<header class="app-header">
  <div class="app-header-inner">
    <h1 class="app-title">Project Management Tool</h1>

    <nav class="app-nav" aria-label="Navigation principale">
      <div class="nav-links">
        <a routerLink="/login" *ngIf="!(isLoggedIn$ | async)">Connexion</a>
        <a routerLink="/register" *ngIf="!(isLoggedIn$ | async)">Inscription</a>
        <a routerLink="/projects" *ngIf="isLoggedIn$ | async">Projets</a>
      </div>

      <div class="nav-right" *ngIf="isLoggedIn$ | async">
        <span class="user-indicator">
          Connecté en tant que <strong>{{ userEmail$ | async }}</strong>
          <span class="role-badge" *ngIf="(userRole$ | async) as role">
            {{ role }}
          </span>
        </span>

        <button (click)="logout()" class="logout-btn" type="button">
          Déconnexion
        </button>
      </div>
    </nav>
  </div>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>&copy; 2025 Project Management Tool Adrien</p>
</footer>
